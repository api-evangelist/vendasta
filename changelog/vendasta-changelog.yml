notes: >-
  The Vendasta API Gateway keeps a dated change log as part of its published documentation source
  (the Stoplight project behind developers.vendasta.com/platform). It is a running list of announced
  changes, not a release-tag history — Vendasta deliberately does not version its Platform REST APIs
  (info.version is literally "Evergreen"); maturity is tracked per operation/field with the
  `x-lifecycle` extension instead. See lifecycle/vendasta-lifecycle.yml. 40 dated entries run from
  2020-12-02 to 2025-11-18; the recent window is captured below. NOTE the log is not current with the
  platform: no entry has been published since 2025-11-18 even though the specs themselves are still
  being edited (the api-gateway-docs repo pushed on 2026-08-13).
