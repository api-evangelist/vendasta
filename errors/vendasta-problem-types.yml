  title: Forbidden
  meaning: The authenticated caller lacks permission for the requested resource.
  remediation: Verify the partner/account scope of the credentials being used.
- status: 404
  title: Not Found
  meaning: The referenced resource (account, user, customer, file group, etc.) does not exist.
  remediation: Verify the id/path segment; the resource may have been deleted or belongs to another partner.
- status: 500
  title: Internal Server Error
  meaning: An unexpected error occurred on the Vendasta side.
  remediation: Retry with backoff; if persistent, contact Vendasta support.
