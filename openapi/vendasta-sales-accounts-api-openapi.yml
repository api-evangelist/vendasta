                        serviceAreaBusiness: true
                        geoCoordinate:
                          latitude: -90
                          longitude: -180
                      relationships:
                        salesPeople:
                          data:
                          - id: U-123123-123123
                            type: users
                        businessPartner:
                          data:
                            type: partners
                            id: ABC
                        businessCategories:
                          data:
                          - type: businessCategories
                            id: active:diving:freediving
