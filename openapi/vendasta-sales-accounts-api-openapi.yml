                        businessPartner:
                          data:
                            type: partners
                            id: ABC
                        businessCategories:
                          data:
                          - type: businessCategories
                            id: active:diving:freediving
                        type: salesAccounts
                      included:
                      - id: AG-1231231
                        type: salesAccountCustomFields
                        partnerFields:
                        - fieldId: FieldID-1231231-12312312
                          stringValue: Text value
