notes: >-
  Vendasta publishes first-party client libraries to three registries — npm (the @vendasta scope,
  one package per platform service, plus a legacy top-level vendasta-sdk), Packagist (the vendasta/*
  PHP libraries, including `vendasta/vax`, "Vendasta API Extensions for PHP"), and Maven Central
  (the com.vendasta group, one artifact per service). Nothing on PyPI, NuGet, RubyGems, crates.io or
  pkg.go.dev (searched 2026-08-13; pypi.org/pypi/vendasta/json returns 404, the NuGet query returns
  0 hits).
  CURRENCY IS THE STORY HERE. The `vax` API-extension libraries — the ones actually intended for
  API consumers — are all stale: PHP `vendasta/vax` 1.3.0 last released 2021-06-08, Maven
  `com.vendasta:vax.v1` 0.3.0 last released 2020-05-14, and the C# and Java editions have no
  registry release at all. Every Maven artifact in the com.vendasta group is 2019-2021. The legacy
  `vendasta-sdk` on npm last shipped in 2017. What IS current is the @vendasta npm scope — but those
  are Angular libraries for building Vendasta-platform frontend apps, not REST API clients for the
  gateway. So: an integrator calling prod.apigateway.co in 2026 has NO maintained first-party SDK in
  any language, five years after the gateway launched. @pipedream/vendasta exists but is a
  third-party Pipedream integration and is not marked official.
