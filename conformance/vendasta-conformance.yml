notes: >-
  Standards conformance for the Vendasta API Gateway and the legacy Marketplace API V1. Vendasta
  states its standards posture explicitly — "When facing a design decision we have opted to follow
  existing standards instead of defining yet another way. Most notably we use JSON:API as the default
  format for requests" — and backs it with a real SCIM 2.0 implementation and an OpenID Connect
  authorization server. Compliance certifications are captured in security/vendasta-trust-center.yml.
