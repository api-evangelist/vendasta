    accounts, users and their location permissions, orders and order custom fields, order fulfillment
    forms, subscriptions and subscription assignments, purchases, products, partner activatable products,
    automations and automation runs, plus country/region reference data. Requests and responses follow
    JSON:API over application/vnd.api+json with page[limit]/page[cursor] paging and filter[] query params.
