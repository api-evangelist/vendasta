aid: vendasta
name: Vendasta
description: 'Vendasta is an end-to-end commerce and operating platform that lets agencies, media companies,
  banks, telcos and other channel partners sell digital products and services to small and medium-sized
  businesses under their own brand. The platform bundles a white-label Marketplace of resellable products,
  a Business App client dashboard, CRM and sales pipeline, marketing automation, billing, managed WordPress
  hosting and a family of AI Employees. Vendasta exposes two distinct API surfaces. The API Gateway at
  prod.apigateway.co is the current one: 30 first-party OpenAPI documents covering Platform (business
  locations, users, orders, subscriptions, automations), CRM, SCIM 2.0 user provisioning, Local SEO, Reputation,
  Social, Customer Voice, Advertising Intelligence, AI Employees, AI Knowledge, Meetings, Forms and Website
  Pro — JSON:API over application/vnd.api+json, secured by OAuth2 with 73 published scopes, deliberately
  unversioned with per-operation x-lifecycle maturity. The legacy Marketplace API V1 at developers.vendasta.com/api/v1
  remains for vendor apps: accounts, users, customers, add-ons, activities, executive reports and file
  groups, plus eight JWT-signed Marketplace webhooks. Headquartered in Saskatoon, Canada, Vendasta was
  founded in 2008.'
