- aid: vendasta:vendasta-activity-api
  name: Vendasta activity API
  description: >-
    The Activity API lets you inform us of new activity from your Marketplace App.  It will be displayed
    in the user's activity stream and used for notifications.  Note: This endpoint has duplicate detection.  Within
    an hour boundary (E.g. 3:00am to 3:59am), we will only generate a single activity object on our servers
    for messages we deem "identical".  We compare title, content, account_id, link, media_url, activity_type,
    and template_data.  This is subject to change.
  humanURL: https://developers.vendasta.com/vendor
  baseURL: https://developers.vendasta.com/api/v1
  tags:
  - activity
  properties:
  - type: OpenAPI
