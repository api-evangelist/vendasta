aid: vendasta
name: Vendasta
description: 'Vendasta is an end-to-end commerce and operating platform that lets agencies,
  media companies, banks, telcos and other channel partners sell digital products and services
  to small and medium-sized businesses under their own brand. The platform bundles a white-label
  Marketplace of resellable products, a Business App client dashboard, CRM and sales pipeline,
  marketing automation, billing and an AI-powered concierge. Vendasta''s public Marketplace
  API V1 is a REST API secured with OAuth2 bearer tokens that lets partners manage accounts,
  users, customers, activated add-ons, activities, executive reports, file groups and pending
  activations programmatically, plus a set of Early Access platform APIs and per-service SDKs
  for deeper integrations. Headquartered in Saskatoon, Canada, Vendasta was founded in 2008.'
