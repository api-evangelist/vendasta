source: https://github.com/vendasta/api-gateway-docs/blob/master/docs/Overview/Versioning.md
docs: https://developers.vendasta.com/platform
notes: >-
  Vendasta publishes a genuine, written deprecation policy — one of the more explicit in the catalog.
  It refuses API versioning outright ("Evergreen") and instead assigns a maturity status to EVERY
  operation, parameter and attribute via an `x-lifecycle` OpenAPI extension, with dated `deprecated`
  and `proposedRemoval` fields on anything being retired. The commitment is 2 years of notice between
  announcing a deprecation and removing a GA item, and 30 days for an Early Access item. There is a
  public status page and a dated change log. The gap: no RFC 8594 Sunset/Deprecation HTTP headers are
  emitted, and no SLA/uptime target is published — deprecation is discoverable only by reading the
  spec or by sending the `fields` query parameter, which triggers Vendasta's warning system.
  Note also the strategic state of the surface: the Guides overview states the Platform APIs "are now
  in maintenance mode. Beyond the CRM API there will be little further development on these APIs",
  and a gRPC reverse-proxy gateway is announced as "Coming Soon".
versioning:
  scheme: evergreen
  current: Evergreen
  docs: https://github.com/vendasta/api-gateway-docs/blob/master/docs/Overview/Versioning.md
  detail: >-
    "No one likes having to update their entire system from one version to the next. That is why we
    designed our API to continuously evolve. Each operation, parameter and attribute has its own
    lifecycle defined in the documentation as an `x-lifecycle` property."
  channels:
  - {name: Platform / gateway REST APIs, docs: https://developers.vendasta.com/platform, status: maintenance-mode}
  - {name: Marketplace API V1 (vendor), docs: https://developers.vendasta.com/vendor, scheme: uri-path, current: v1}
  - {name: Legacy APIs, docs: https://developers.vendasta.com/api/legacy, status: not-recommended-for-new-integrations}
  - {name: gRPC reverse-proxy gateway, status: announced-coming-soon}
maturity_ladder:
  extension: x-lifecycle
  statuses:
  - {status: proposed, detail: Under consideration; usable only against the mock server.}
  - {status: trustedTester, detail: Newly built, rapid iteration with selected partners; breaking changes possible and communicated directly.}
  - {status: earlyAccess, detail: Complete and stabilizing — the public beta. 30 days notice aimed for on breaking changes; promotes to GA after 90 days of stability.}
  - {status: generalAvailability, detail: Proven under load. Backward-compatible additions only.}
  - {status: deprecated, detail: Still usable; 2 years of support between announcement and removal for items that reached GA.}
  - {status: removed, detail: Sunset; no longer callable.}
deprecation:
  policy_url: https://github.com/vendasta/api-gateway-docs/blob/master/docs/Overview/Versioning.md
  published: true
